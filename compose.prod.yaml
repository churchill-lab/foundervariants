# Production compose file: pull a published image and run it. No build, no source checkout.
#
# This file is self-contained — copy it and a .env to the server; nothing else is needed:
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# Publish the image from a development machine first (the server is linux/amd64):
#
#   docker buildx build --platform linux/amd64 -t churchilllab/foundervariants:0.2.0 --push .
#
# Settings come from a local .env file (see .env.example). Every value has a default here
# EXCEPT the databases, which must exist on the host: HOST_DB_DIR is mounted read-only and
# the service has nothing to serve without it.
services:
  foundervariants:
    image: ${IMAGE_NAME:-churchilllab/foundervariants:0.2.0}
    # Always re-pull on `up`, so redeploying a moved tag picks up the new image.
    pull_policy: always
    platform: ${PLATFORM:-linux/amd64}
    environment:
      FV_DB_DIR: ${FV_DB_DIR:-/data/dbs}
      # Reverse-proxy prefix for URL generation; must match the Apache <Location>.
      FV_BASE_PATH: ${FV_BASE_PATH:-}
      # Comma-separated allowed CORS origins; empty allows all.
      FV_CORS_ORIGINS: ${FV_CORS_ORIGINS:-}
      # Log level (DEBUG/INFO/WARNING/...); database discovery logs at INFO.
      FV_LOG_LEVEL: ${FV_LOG_LEVEL:-INFO}
    volumes:
      # Host databases mounted READ-ONLY — the app opens them with SQLite's `immutable=1`
      # and never writes. Discovery runs once at startup, so
      # `docker compose -f compose.prod.yaml restart` is required after adding or
      # replacing a .sqlite file here.
      - ${HOST_DB_DIR:-/srv/foundervariants/dbs}:${FV_DB_DIR:-/data/dbs}:ro
    ports:
      # host:container — Apache proxies the base path to this host port.
      - "${HOST_PORT:-28224}:8000"
    restart: unless-stopped
    healthcheck:
      # Hit /health with the interpreter already in the image (no curl in slim).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
