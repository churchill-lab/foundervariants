<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linking to FounderVariants</title>
<script>
  // apply saved theme before paint (no flash); shared with the main page
  (function () {
    const t = localStorage.getItem("fv_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="%%BASE%%/static/site.css">
</head>
<body>
<div class="wrap">
  <div class="cmd">
    <a class="brand" href="%%BASE%%/" title="Back to the search"><b>Founder</b><i>Variants</i></a>
    <div class="spacer"></div>
    <a href="%%BASE%%/">Search</a>
    <a href="%%BASE%%/docs" target="_blank">API</a>
    <button id="theme" title="Toggle theme" aria-label="Toggle light/dark theme">
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
  <main id="doc" class="doc"><p class="status">Loading…</p></main>
</div>

<script src="%%BASE%%/static/marked.min.js"></script>
<script>
const BASE = "%%BASE%%";
const $ = s => document.querySelector(s);

$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nx);
  localStorage.setItem("fv_theme", nx);
};

// GitHub-style heading ids, so the doc's own #anchor links work
const slug = t => t.trim().toLowerCase().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");

// The page text is LINKING.md, rendered here so the document and the page cannot drift.
fetch(BASE + "/static/LINKING.md")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    const doc = $("#doc");
    doc.innerHTML = marked.parse(md);   // our own file, not user input
    // relative links in the doc (docs, ?release=..., 2021/so_terms) are relative to the
    // site's base path, whatever URL this page was reached by
    doc.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      if (!/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(h)) a.setAttribute("href", BASE + "/" + h);
    });
    doc.querySelectorAll("h1,h2,h3,h4").forEach(h => { h.id = slug(h.textContent); });
    const h1 = doc.querySelector("h1");
    if (h1) document.title = h1.textContent;
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  })
  .catch(e => { $("#doc").innerHTML = '<p class="status">Could not load the linking guide.</p>'; console.error(e); });
</script>
</body>
</html>
