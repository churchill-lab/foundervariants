[project]
name = "foundervariants"
version = "0.2.0"
description = "Fast local DO/CC founder SNP genotypes (SDP/SDPN), built from Sanger VCFs into one compact SQLite per genome build that is also a drop-in R/qtl2 variant database."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Vincent", email = "matt.vincent@jax.org" }]
# The query layer is pure stdlib sqlite3; serving adds only FastAPI/uvicorn.
# Building from a VCF needs one reader and nothing else — it writes the served SQLite
# directly, so a machine that only serves databases installs none of this.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
build = ["cyvcf2>=0.31"]

[project.scripts]
foundervariants = "foundervariants.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundervariants"]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The httpx-vs-httpx2 notice comes from starlette's TestClient, not from our code.
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
