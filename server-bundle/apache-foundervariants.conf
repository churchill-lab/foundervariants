# Apache reverse-proxy config for the FounderVariants service.
#
# Add this to the Apache config on the host that serves the site. Apache strips the base
# path and forwards to the Docker container; the container reads FV_BASE_PATH so its
# generated URLs (docs, static assets) still carry the prefix.
#
# As deployed on churchilllab.jax.org (conf.d/vhost/churchilllab.conf).
# For another host, change the hostname, and the <Location> path and port to match .env.
#
# Keep three things in sync:
#   * the <Location> path below         (e.g. /foundervariants)
#   * FV_BASE_PATH in .env              (must equal that path)
#   * the proxy target port             (must equal HOST_PORT in .env, default 28224)
#
# Requires: mod_proxy, mod_proxy_http, mod_headers.
#
# TRAILING SLASHES: inside <Location>, the Location path and the ProxyPass target must
# agree — both without a trailing slash (as below), or both with one. Mixing them
# (`<Location /foundervariants>` plus `http://localhost:28224/`) makes Apache append the
# matched remainder to a target that already ends in `/`, so `/foundervariants/genomes`
# reaches the app as `//genomes` and 404s. The symptom is deceptive: `/foundervariants`
# itself still returns the UI (empty remainder, no doubling), so the page loads and only
# its API calls fail.

<Location /foundervariants>
    # Strip the /foundervariants prefix and forward to the container's published host port.
    #
    # timeout=1800 is the PER-ROUTE form, and the only one usable here: the standalone
    # `ProxyTimeout` directive is valid in server-config and <VirtualHost> context only,
    # and Apache rejects it inside <Location> with
    #   "ProxyTimeout not allowed in <Location> context".
    # It matters because GET /{release}/download/rqtl2 streams a whole ~4 GB database:
    # the default (usually 300s) is measured between reads rather than across the transfer,
    # so it is normally fine, but a slow client on a slow link can trip it.
    ProxyPass         http://localhost:28224 timeout=1800
    ProxyPassReverse  http://localhost:28224

    # Tell the app it is behind an HTTPS reverse proxy under this prefix.
    RequestHeader set X-Forwarded-Proto  "https"
    RequestHeader set X-Forwarded-Host   "churchilllab.jax.org"
    RequestHeader set X-Forwarded-Prefix "/foundervariants"

    ProxyPreserveHost On
    ProxyAddHeaders   On
</Location>

# SECOND NAME: /foundersnps -> /foundervariants. Put this at <VirtualHost> level, next to
# (not inside) the <Location> block. Requires mod_alias (loaded by default).
#
# /foundersnps was the original address, so links to it exist; this keeps them working.
# A redirect rather than a second proxied <Location>: the app writes FV_BASE_PATH into its
# pages, so a page served under a second prefix would still call back to /foundervariants,
# and every page would have two addresses (split bookmarks, shared links and logs). The
# rest of the path AND the query string carry over, so deep links work under either name:
#   /foundersnps/?release=GRCm38&chr=10&pos=128350502
#     -> 301 /foundervariants/?release=GRCm38&chr=10&pos=128350502
# The pattern must start with "^/": request paths always begin with a slash, so
# "^foundersnps..." can never match (and fails silently: no error, just a 404).
# The target must be an ABSOLUTE https:// URL. TLS is terminated before this Apache, so
# it sees plain http and turns a relative target into http://churchilllab.jax.org/...,
# and port 80 is closed: the redirect "works" but the browser then cannot connect.
# 301 (permanent) because the alias is meant to last; browsers cache it, so use 302 while
# you are still deciding.
RedirectMatch 301 "^/foundersnps(/.*)?$" "https://churchilllab.jax.org/foundervariants$1"

# OPTIONAL, and worth doing if the R/qtl2 download sees real use: serve the database files
# straight off disk instead of proxying 4 GB through the app. Apache handles range
# requests, resumable downloads and Content-Length natively, none of which the proxied
# FileResponse gives you (see the download caveat in docs/DEPLOYMENT.md).
#
# <Directory /srv/foundervariants/dbs>
#     Require all granted
#     Options -Indexes
# </Directory>
# Alias /foundervariants-dbs /srv/foundervariants/dbs
